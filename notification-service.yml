server:
  port: 8086

spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintechwave_notif}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    consumer:
      group-id: notification-service
    producer:
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        retry.backoff.ms: 500

  mail:
    host: "${SMTP_HOST:smtp.sendgrid.net}"
    port: "${SMTP_PORT:587}"
    username: "${SMTP_USERNAME:apikey}"
    password: "${SMTP_PASSWORD:SG.placeholder}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  notification:
    from-email: "${NOTIFICATION_FROM_EMAIL:noreply@fintechwave.com}"
    from-name: FintechWave
    enabled-channels: EMAIL
    retention-days: 90

management:
  health:
    mail:
      enabled: false

logging:
  level:
    "[com.fintechwave.notification]": INFO
    "[org.springframework.mail]": INFO
