server:
  port: 8084

spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintechwave_tx}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongoroot:mongopassword@localhost:27017/fintechwave_views?authSource=admin}

  kafka:
    consumer:
      group-id: transaction-service

app:
  stripe:
    api-key: "${STRIPE_API_KEY:sk_test_placeholder}"
    webhook-secret: "${STRIPE_WEBHOOK_SECRET:whsec_placeholder}"

grpc:
  client:
    ledger-service:
      address: "dns:///${LEDGER_SERVICE_HOST:localhost}:9095"
      negotiation-type: plaintext

logging:
  level:
    "[com.fintechwave.transaction]": INFO
