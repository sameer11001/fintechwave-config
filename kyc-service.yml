server:
  port: 8082

spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintechwave_kyc}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongoroot:mongopassword@localhost:27017/fintechwave_views?authSource=admin}

  kafka:
    consumer:
      group-id: kyc-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  minio:
    endpoint: "${MINIO_ENDPOINT:http://localhost:9000}"
    access-key: "${MINIO_ACCESS_KEY:minioadmin}"
    secret-key: "${MINIO_SECRET_KEY:minioadmin}"

logging:
  level:
    "[com.fintechwave.kyc]": DEBUG
