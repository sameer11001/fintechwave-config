server:
  port: 8082

spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintechwave_kyc}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongoroot:mongopassword@localhost:27017/fintechwave_views?authSource=admin}

  kafka:
    consumer:
      group-id: kyc-service
    producer:
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        retry.backoff.ms: 500

logging:
  level:
    "[com.fintechwave.kyc]": INFO

resilience4j:
  circuitbreaker:
    instances:
      minioStorage:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 2
