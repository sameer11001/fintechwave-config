# ============================================================
# SHARED — served to every microservice.
# Do NOT put service-specific values here.
# ============================================================

# --------------- Keycloak (Platform-Wide) -------------------
app:
  keycloak:
    issuer-uri: "${KEYCLOAK_EXTERNAL_URL:http://localhost:8180}/realms/fintechwave"
    jwk-set-uri: "${KEYCLOAK_URL:http://localhost:8180}/realms/fintechwave/protocol/openid-connect/certs"
    expected-audience: fintechwave-platform

# --------------- OAuth2 Resource Server ---------------------
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.keycloak.issuer-uri}
          jwk-set-uri: ${app.keycloak.jwk-set-uri}

  # --------------- Kafka (Shared Cluster) -------------------
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:29092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: MANUAL_IMMEDIATE

  # --------------- JPA Defaults (all DB services) -----------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": false

  # --------------- Flyway Defaults --------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --------------- DataSource Defaults ----------------------
  datasource:
    driver-class-name: org.postgresql.Driver
    username: "${DB_USER:postgres}"
    password: "${DB_PASS:postgres}"

  # --------------- Cloud Bus (Kafka) ------------------------
  cloud:
    bus:
      enabled: true

  # --------------- MongoDB Defaults -------------------------
  data:
    mongodb:
      uuid-representation: java-legacy

# --------------- Global Error Policy ------------------------
server:
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    accesslog:
      enabled: true
      pattern: "%h %l %u %t \"%r\" %s %b %D"
      directory: /dev
      prefix: stdout
      suffix: ""
      file-date-format: ""

# --------------- Actuator -----------------------------------
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info, refresh, busrefresh, prometheus, metrics, loggers
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0  # 100% in dev; set to 0.1 in prod

# --------------- Logging (Global Defaults) ------------------
logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
  level:
    root: INFO
    "org.springframework": WARN
    "org.hibernate.SQL": WARN
    "org.apache.kafka": WARN
    "[org.springframework.security]": INFO
    "[org.springframework.cloud.config]": INFO
    "[org.springframework.cloud.gateway]": INFO
    "[org.springframework.web]": DEBUG
    "[org.springframework.web.filter.CommonsRequestLoggingFilter]": DEBUG
    "[com.fintechwave]": INFO
