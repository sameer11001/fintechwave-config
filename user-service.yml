server:
  port: 8081

spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintechwave_users}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongoroot:mongopassword@localhost:27017/fintechwave_views?authSource=admin}
  
  kafka:
    consumer:
      group-id: user-service

app:
  keycloak:
    admin:
      base-url: "${KEYCLOAK_URL:http://localhost:8180}"
      realm: fintechwave
      client-id: "${KEYCLOAK_ADMIN_CLIENT_ID:user-service}"
      client-secret: "${KEYCLOAK_ADMIN_CLIENT_SECRET:hHGxsgnCIbqrojiSJdp1tKMNBfBboBNv}"

logging:
  level:
    "[com.fintechwave.iam]": INFO
