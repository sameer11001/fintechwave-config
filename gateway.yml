server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 10s
      routes:
        - id: user-service
          uri: "http://user-service:8081"
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**, /api/v1/internal/**
        - id: kyc-service
          uri: "http://kyc-service:8082"
          predicates:
            - Path=/api/v1/kyc/**, /api/v1/admin/kyc/**
        - id: ledger-service
          uri: "http://ledger-service:8083"
          predicates:
            - Path=/api/v1/ledger/**, /api/v1/accounts/**
        - id: transaction-service
          uri: "http://transaction-service:8084"
          predicates:
            - Path=/api/v1/transactions/**, /api/v1/webhooks/**
        - id: fraud-service
          uri: "http://fraud-service:8085"
          predicates:
            - Path=/api/v1/fraud/**
        - id: notification-service
          uri: "http://notification-service:8086"
          predicates:
            - Path=/api/v1/notifications/**
        - id: reporting-service
          uri: "http://reporting-service:8087"
          predicates:
            - Path=/api/v1/reports/**

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      connect-timeout: 2s
      timeout: 1s

management:
  endpoint:
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

info:
  app:
    name: "gateway"
    description: "FintechWave API Gateway — single entry point for all microservices"
    version: "1.0.0"

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10000

logging:
  level:
    "[com.fintechwave.gateway]": INFO
    "[org.springframework.cloud.gateway]": INFO
    "[reactor.netty.http.server]": INFO
