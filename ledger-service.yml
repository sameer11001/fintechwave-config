server:
  port: 8083

grpc:
  server:
    port: 9095

spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintechwave_ledger}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  kafka:
    consumer:
      group-id: ledger-service

logging:
  level:
    "[com.fintechwave.ledger]": DEBUG
