server:
  port: 8087

spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintechwave_report}"
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000

  kafka:
    consumer:
      group-id: reporting-service
  
  # Reporting service doesn't use flyway
  flyway:
    enabled: false

logging:
  level:
    "[com.fintechwave.reporting]": DEBUG
