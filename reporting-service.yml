server:
  port: 8087

spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintechwave_report}"
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

  kafka:
    consumer:
      group-id: reporting-service
  
  # Reporting service doesn't use flyway
  flyway:
    enabled: false

logging:
  level:
    "[com.fintechwave.reporting]": INFO
